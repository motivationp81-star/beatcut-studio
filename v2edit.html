<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeatCut V2 Edit — frame-exact beat edit prototype</title>
<style>
  body { background:#14161c; color:#e8eaf0; font-family:system-ui,sans-serif; margin:20px; }
  h1 { font-size:20px; } label { display:block; margin:12px 0 4px; }
  input[type=text], textarea { width: min(560px, 92vw); padding:8px; border-radius:6px; border:1px solid #3a3f4d; background:#0c0e12; color:#e8eaf0; }
  button { background:#ffd23e; border:0; padding:12px 22px; font-weight:700; border-radius:8px; cursor:pointer; margin-top:14px; }
  #status { background:#0c0e12; padding:12px; border-radius:8px; white-space:pre-wrap; min-height:120px; margin-top:16px; font-size:13px; }
  a { color:#ffd23e; font-weight:700; }
</style>
</head>
<body>
<h1>BeatCut V2 Edit — frame-exact beat edit (offline WebCodecs render)</h1>
<p>Clips + song → beat analysis → segments → every output frame rendered exactly (30 fps, none dropped). Calm grade, subtle zoom punch, pop-and-vanish text.</p>
<label>Video clips (1-4) <input type="file" id="clipFiles" accept="video/*" multiple></label>
<label>Song <input type="file" id="songFile" accept="audio/*"></label>
<label>Hook text <input type="text" id="hookText" value="O FIRKI WALI"></label>
<label>Lyrics — one line per line (can be empty)</label>
<textarea id="lyrics" rows="4"></textarea>
<br><button id="go">RENDER EDIT</button>
<div id="status">Waiting…</div>
<p id="result"></p>

<script type="module">
import * as MB from "https://cdn.jsdelivr.net/npm/mediabunny@1.65.0/+esm";

const el = (id) => document.getElementById(id);
const statusEl = el("status");
const say = (m) => { statusEl.textContent += "\n" + m; };
statusEl.textContent = "Engine: " + (MB.Input ? "mediabunny OK" : "FAILED");

/* ---------- beat analysis (same family as the main tool) ---------- */
async function analyseBeats(buf) {
  const sr = buf.sampleRate, ch = buf.getChannelData(0);
  const off = new OfflineAudioContext(1, ch.length, sr);
  const src = off.createBufferSource(); src.buffer = buf;
  const lp = off.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 160;
  src.connect(lp); lp.connect(off.destination); src.start();
  const low = (await off.startRendering()).getChannelData(0);
  const hop = 512, win = 2048, n = Math.floor(low.length / hop);
  const energy = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let s = 0; const st = i * hop;
    for (let j = 0; j < win && st + j < low.length; j += 16) s += low[st + j] * low[st + j];
    energy[i] = s;
  }
  const beats = [];
  for (let i = 2; i < n - 2; i++) {
    const avg = (energy[i - 2] + energy[i - 1] + energy[i + 1] + energy[i + 2]) / 4;
    if (energy[i] > avg * 1.35 && energy[i] > 0.02) {
      const t = (i * hop) / sr;
      if (!beats.length || t - beats[beats.length - 1].t > 0.18) {
        let mx = 0.0001; for (let k = Math.max(0, i - 8); k < Math.min(n, i + 8); k++) mx = Math.max(mx, energy[k]);
        beats.push({ t, s: Math.min(1, energy[i] / mx) });
      }
    }
  }
  let bpm = 0;
  if (beats.length > 2) {
    const gaps = []; for (let i = 1; i < beats.length; i++) gaps.push(beats[i].t - beats[i - 1].t);
    gaps.sort((a, b) => a - b); bpm = Math.round(60 / gaps[Math.floor(gaps.length / 2)]);
  }
  return { beats, bpm };
}

async function pickAudioCodec(chCount, sr) {
  for (const [name, full] of [["aac", "mp4a.40.2"], ["opus", "opus"]]) {
    try {
      const sup = await AudioEncoder.isConfigSupported({ codec: full, sampleRate: sr, numberOfChannels: chCount, bitrate: 128000 });
      if (sup.supported) return name;
    } catch (e) { /* next */ }
  }
  return null;
}

el("go").addEventListener("click", async () => {
  const clipFiles = [...el("clipFiles").files];
  const songF = el("songFile").files[0];
  if (!clipFiles.length || !songF) { say("Pick clips and a song first."); return; }
  const started = performance.now();
  try {
    const W = 720, H = 1280, FPS = 30;

    say("Decoding song + analysing beats…");
    const actx = new AudioContext({ sampleRate: 48000 });
    const songBuf = await actx.decodeAudioData(await songF.arrayBuffer());
    const DUR = Math.min(40, songBuf.duration);
    const { beats, bpm } = await analyseBeats(songBuf);
    say("Beats: " + beats.length + " · ~" + bpm + " BPM · edit length " + DUR.toFixed(1) + "s");

    /* ---------- build segments: energy-gated, half-time on very fast songs ---------- */
    const inRange = beats.filter(b => b.t < DUR);
    const minStep = bpm > 160 ? 2 : 1, minGap = bpm > 160 ? 0.5 : 0.3;
    const cutTimes = [0];
    let since = 0, lastCut = 0;
    inRange.forEach(b => {
      since++;
      const strong = b.s > 0.75, weak = b.s < 0.22;
      if ((since >= minStep && !weak) || (strong && since >= 1 && b.t - lastCut > minGap) || (since >= minStep * 2)) {
        if (b.t - lastCut > 0.42) { cutTimes.push(b.t); lastCut = b.t; since = 0; }
      }
    });
    cutTimes.push(DUR);
    const segments = [];
    const cursors = clipFiles.map(() => 0);
    for (let i = 0; i < cutTimes.length - 1; i++) {
      const start = cutTimes[i], end = cutTimes[i + 1], len = end - start;
      const clipIdx = i % clipFiles.length;
      segments.push({ start, end, clipIdx, srcStart: cursors[clipIdx], rate: 1, strong: (inRange.find(b => Math.abs(b.t - start) < 0.05) || {}).s || 0.4 });
      cursors[clipIdx] += len;
    }
    say("Segments: " + segments.length + " across " + clipFiles.length + " clip(s)");

    /* ---------- word timings from beats ---------- */
    const hook = el("hookText").value.trim();
    const lines = el("lyrics").value.split("\n").map(x => x.trim()).filter(Boolean);
    const wordTimes = [];
    {
      const t0 = hook ? 1.6 : 0;
      const pool = inRange.filter(b => b.t >= t0 && b.s > 0.3);
      let bi = 0;
      lines.forEach(line => line.split(/\s+/).filter(Boolean).forEach(w => { if (bi < pool.length) wordTimes.push({ word: w, t: pool[bi++].t }); }));
    }

    /* ---------- open clip inputs ---------- */
    const clipData = [];
    for (const f of clipFiles) {
      const input = new MB.Input({ source: new MB.BlobSource(f), formats: MB.ALL_FORMATS });
      const track = await input.getPrimaryVideoTrack();
      clipData.push({ input, track, sink: new MB.VideoSampleSink(track), dur: await input.computeDuration() });
    }
    // wrap source cursors that ran past a clip's end
    segments.forEach(sg => { const d = clipData[sg.clipIdx].dur; if (d > 1) sg.srcStart = sg.srcStart % Math.max(1, d - (sg.end - sg.start) - 0.1 > 0 ? d - 0.05 : d); });

    /* ---------- output ---------- */
    const audioCodec = await pickAudioCodec(Math.min(2, songBuf.numberOfChannels), 48000);
    say("Audio encoder: " + (audioCodec ? audioCodec.toUpperCase() : "none (video-only)"));
    const canvas = new OffscreenCanvas(W, H);
    const ctx = canvas.getContext("2d");
    const target = new MB.BufferTarget();
    const output = new MB.Output({ format: new MB.Mp4OutputFormat(), target });
    const vSrc = new MB.CanvasSource(canvas, { codec: "avc", bitrate: 8_000_000 });
    output.addVideoTrack(vSrc);
    let aSrc = null;
    if (audioCodec) {
      aSrc = new MB.AudioBufferSource({ codec: audioCodec, bitrate: 128_000 });
      output.addAudioTrack(aSrc);
    }
    await output.start();
    if (aSrc) {
      const sr = songBuf.sampleRate, len = Math.floor(DUR * sr);
      const sub = actx.createBuffer(songBuf.numberOfChannels, len, sr);
      for (let c = 0; c < songBuf.numberOfChannels; c++) sub.getChannelData(c).set(songBuf.getChannelData(c).subarray(0, len));
      await aSrc.add(sub);
    }

    /* ---------- render, segment by segment, samples pulled in order ---------- */
    const totalFrames = Math.floor(DUR * FPS);
    let frame = 0;
    const beatAt = (t) => { let s = 0; for (const b of inRange) { if (Math.abs(b.t - t) < 0.06) s = Math.max(s, b.s); } return s; };

    for (const sg of segments) {
      const cd = clipData[sg.clipIdx];
      const srcEnd = Math.min(cd.dur, sg.srcStart + (sg.end - sg.start) * sg.rate + 0.1);
      const iter = cd.sink.samples(sg.srcStart, srcEnd)[Symbol.asyncIterator]();
      let cur = (await iter.next()).value || null;
      const segFrames = Math.max(1, Math.round((sg.end - sg.start) * FPS));
      for (let k = 0; k < segFrames && frame < totalFrames; k++, frame++) {
        const t = frame / FPS;
        const srcT = sg.srcStart + (t - sg.start) * sg.rate;
        while (cur && cur.timestamp + cur.duration <= srcT + 0.001) { const nx = (await iter.next()).value || null; cur.close(); cur = nx; }
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
        if (cur) {
          const age = t - sg.start;
          const punch = sg.strong > 0.72 ? Math.max(0, 1 - age / 0.28) : Math.max(0, 1 - age / 0.5) * 0.5;
          const z = 1 + 0.16 * punch + 0.02 * Math.sin(Math.min(1, age / Math.max(0.2, sg.end - sg.start)) * Math.PI);
          ctx.save();
          ctx.filter = "contrast(1.07) saturate(1.07)";
          ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
          cur.draw(ctx, 0, 0, W, H);
          ctx.restore();
          ctx.filter = "none";
        }
        /* text: hook only at the very start; words pop and vanish */
        ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
        if (hook && t < 1.6) {
          const a = t < 0.2 ? t / 0.2 : (t > 1.35 ? Math.max(0, (1.6 - t) / 0.25) : 1);
          ctx.globalAlpha = a;
          ctx.font = "900 92px system-ui, 'Arial Black', sans-serif";
          ctx.lineWidth = 12; ctx.strokeStyle = "rgba(0,0,0,0.9)"; ctx.lineJoin = "round";
          ctx.fillStyle = "rgba(0,0,0,0.38)"; ctx.fillRect(10, H * 0.4 - 78, W - 20, 156);
          ctx.strokeText(hook.toUpperCase(), W / 2, H * 0.4);
          ctx.fillStyle = "#ffd23e"; ctx.fillText(hook.toUpperCase(), W / 2, H * 0.4);
        } else {
          let wd = null;
          for (const w of wordTimes) { if (w.t <= t) wd = w; else break; }
          if (wd && t - wd.t < 0.6) {
            const age = t - wd.t, sc = age < 0.09 ? 0.6 + 0.4 * (age / 0.09) : 1;
            ctx.translate(W / 2, H * 0.52); ctx.scale(sc, sc);
            ctx.font = "900 96px system-ui, 'Arial Black', sans-serif";
            ctx.lineWidth = 13; ctx.strokeStyle = "rgba(0,0,0,0.92)"; ctx.lineJoin = "round";
            ctx.strokeText(wd.word.toUpperCase(), 0, 0);
            ctx.fillStyle = "#ffffff"; ctx.fillText(wd.word.toUpperCase(), 0, 0);
          }
        }
        ctx.restore();
        await vSrc.add(t, 1 / FPS);
        if (frame % 150 === 0) say("  frame " + frame + " / " + totalFrames);
      }
      if (cur) cur.close();
    }

    await output.finalize();
    const secs = ((performance.now() - started) / 1000).toFixed(1);
    const blob = new Blob([target.buffer], { type: "video/mp4" });
    const url = URL.createObjectURL(blob);
    say("DONE in " + secs + "s — " + totalFrames + " frames, " + segments.length + " segments. MP4: " + (blob.size / 1048576).toFixed(2) + " MB");
    el("result").innerHTML = '<a href="' + url + '" download="beatcut-v2-edit.mp4">⬇ Download the V2 edit MP4</a>';
  } catch (e) {
    say("ERROR: " + (e && e.message ? e.message : e));
    console.error(e);
  }
});
</script>
</body>
</html>
