<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auto-Lyrics Spike — Whisper in the browser (transformers.js)</title>
<style>
  body { background:#14161c; color:#e8eaf0; font-family:system-ui,sans-serif; margin:20px; }
  button { background:#ffd23e; border:0; padding:11px 20px; font-weight:700; border-radius:8px; cursor:pointer; }
  #log { background:#0c0e12; padding:12px; border-radius:8px; white-space:pre-wrap; min-height:160px; margin-top:14px; font-size:13px; }
</style>
</head>
<body>
<h1>Auto-Lyrics Spike — Whisper inside the page</h1>
<p>Pick the song file, press RUN. The page downloads a Whisper model and transcribes locally (WebGPU if available, else WASM). Nothing is uploaded anywhere.</p>
<label>Song <input type="file" id="songFile" accept="audio/*"></label>
<br><br><button id="go">RUN AUTO-LYRICS</button>
<div id="log">Waiting…</div>

<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3/+esm";
env.allowLocalModels = false;

const logEl = document.getElementById("log");
const say = (m) => { logEl.textContent += "\n" + m; };
logEl.textContent = "Ready. WebGPU: " + (navigator.gpu ? "available" : "NOT available");

async function toMono16k(file) {
  const actx = new AudioContext({ sampleRate: 48000 });
  const buf = await actx.decodeAudioData(await file.arrayBuffer());
  const off = new OfflineAudioContext(1, Math.ceil(buf.duration * 16000), 16000);
  const src = off.createBufferSource(); src.buffer = buf;
  src.connect(off.destination); src.start();
  return (await off.startRendering()).getChannelData(0);
}

document.getElementById("go").addEventListener("click", async () => {
  const f = document.getElementById("songFile").files[0];
  if (!f) { say("Pick the song first."); return; }
  const started = performance.now();
  try {
    say("Decoding + resampling to 16kHz…");
    const audio = await toMono16k(f);
    say("Audio ready: " + (audio.length / 16000).toFixed(1) + "s. Loading model Xenova/whisper-medium …");
    let asr = null, deviceUsed = "";
    try {
      asr = await pipeline("automatic-speech-recognition", "Xenova/whisper-medium", { device: "webgpu" });
      deviceUsed = "webgpu";
    } catch (e) {
      say("WebGPU load failed (" + (e && e.message ? e.message : e) + ") — falling back to WASM q8…");
      asr = await pipeline("automatic-speech-recognition", "Xenova/whisper-medium", { device: "wasm", dtype: "q8" });
      deviceUsed = "wasm-q8";
    }
    say("Model loaded on " + deviceUsed + " in " + ((performance.now() - started) / 1000).toFixed(1) + "s. Transcribing…");
    const t0 = performance.now();
    const out = await asr(audio, {
      language: "hindi", task: "transcribe",
      return_timestamps: true, chunk_length_s: 30, stride_length_s: 5,
    });
    say("TRANSCRIBE DONE in " + ((performance.now() - t0) / 1000).toFixed(1) + "s on " + deviceUsed);
    say("TEXT: " + out.text);
    (out.chunks || []).forEach(c => say("[" + c.timestamp[0].toFixed(1) + " -> " + (c.timestamp[1] || 0).toFixed(1) + "] " + c.text));
  } catch (e) {
    say("ERROR: " + (e && e.message ? e.message : e));
    console.error(e);
  }
});
</script>
</body>
</html>
